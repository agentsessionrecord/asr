[project]
name = "entire-asr"
version = "0.1.0"
description = "Entire CLI external command that exports checkpoints as Agent Session Record files"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["asr-entire"]

[project.scripts]
entire-asr = "entire_asr:main"

[tool.uv.sources]
asr-entire = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
