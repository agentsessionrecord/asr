[project]
name = "asr-importer-core"
version = "0.1.0"
description = "Offline vendor import primitives for ASR"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["agent-session-record", "rfc3339-validator>=0.1.4,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-session-record = { workspace = true }
