[project]
name = "asr-openai-codex-logs"
version = "0.1.0"
description = "Import saved Codex compliance log records"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["asr-importer-core"]

[project.scripts]
asr-import-openai-codex-logs = "asr_openai_codex_logs.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
asr-importer-core = { workspace = true }
