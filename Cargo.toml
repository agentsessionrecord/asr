[workspace]
# Integration tests invoke the Node validator. First run:
# pnpm --filter @agent-session/validate install --frozen-lockfile
# See crates/asr-cli/README.md#tests-and-status.
members = ["crates/asr-core", "crates/asr-convert", "crates/asr-cli", "crates/asr-collect"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
zstd = "0.13"
