[project]
name = "asr-gateway-core"
version = "0.1.0"
description = "Native gateway capture adapters using the LiteLLM recorder core"
requires-python = ">=3.11"
dependencies = ["asr-litellm==0.1.0", "grpcio>=1.70,<2", "xds-protos>=1.70,<2", "cryptography>=49,<51"]

[project.scripts]
asr-gateway = "asr_gateways.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
asr-litellm = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/asr_gateways"]
