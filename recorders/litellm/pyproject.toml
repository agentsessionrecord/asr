[project]
name = "asr-litellm"
version = "0.1.0"
description = "Record native model API traffic from a LiteLLM proxy as ASR"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["agent-session-record==0.1.0", "litellm[proxy]==1.106.6"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-session-record = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
