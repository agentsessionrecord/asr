[project]
name = "asr-tables"
version = "0.1.0"
description = "Export Agent Session Record streams to Parquet tables"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pyarrow==23.0.1", "simplejson==3.20.2", "duckdb==1.4.4"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[project.scripts]
asr-tables = "asr_tables.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_tables"]
