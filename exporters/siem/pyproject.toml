[project]
name = "asr-siem"
version = "0.1.0"
description = "Offline OCSF exports for Splunk, Datadog and Elastic"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
asr-siem = "asr_siem.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asr_siem"]
