[project]
name = "asr-evals"
version = "0.1.0"
description = "Offline ASR eval datasets and shared observability reader"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["agent-session-record==0.1.0"]

[project.scripts]
asr-evals = "asr_evals.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-session-record = { workspace = true }
